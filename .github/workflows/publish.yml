---
name: Build and Publish Container Image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild weekly on Monday at 06:00 UTC to pick up base image / tool updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build container image (local, for testing)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: ${{ github.event_name == 'schedule' && '' || 'type=gha,mode=max' }}
          cache-from: ${{ github.event_name == 'schedule' && '' || 'type=gha' }}

      - name: Verify bundled tools
        run: |
          docker run --rm \
            --memory 2g \
            --cpus 2 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph verify

      - name: Smoke-test render
        run: |
          mkdir -p /tmp/swgraph-test
          docker run --rm \
            -v ${{ github.workspace }}/examples:/input:ro \
            -v /tmp/swgraph-test:/output \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph render /input/graphviz_minimal.gv /input/plantuml_sequence.puml /input/d2_architecture.d2 /input/mermaid_flowchart.mmd
          echo "=== Rendered files ==="
          ls -la /tmp/swgraph-test/
          test -f /tmp/swgraph-test/graphviz_minimal.svg
          test -f /tmp/swgraph-test/plantuml_sequence.svg
          test -f /tmp/swgraph-test/d2_architecture.svg
          test -f /tmp/swgraph-test/mermaid_flowchart.svg

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          format: 'table'

      - name: Report suppressed CVEs (advisory)
        if: always()
        run: |
          {
            echo "## Currently suppressed CVEs"
            echo ""
            echo "Re-review this list when an entry's \`expired_at\` approaches or when upstream ships a fixed binary."
            echo ""
            echo '```'
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --show-suppressed \
              --format table \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push container image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event_name == 'schedule' && '' || 'type=gha' }}
          provenance: false

      - name: Verify published image pulls cleanly
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph version

      - name: Update image size badge
        run: |
          SIZE_BYTES=$(docker image inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format '{{.Size}}')
          SIZE_HUMAN=$(numfmt --to=iec --suffix=B --format="%.1f" "$SIZE_BYTES")
          echo "{\"schemaVersion\":1,\"label\":\"image size\",\"message\":\"${SIZE_HUMAN}\",\"color\":\"blue\"}" > badges/image-size.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/image-size.json
          git diff --cached --quiet || (git commit -m "Update image size badge [skip ci]" && git push)
