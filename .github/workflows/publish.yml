---
name: Build and Publish Container Image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild weekly on Monday at 06:00 UTC to pick up base image / tool updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build container image (local, for testing)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Verify bundled tools
        run: |
          docker run --rm \
            --memory 2g \
            --cpus 2 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph verify

      - name: Smoke-test render
        run: |
          mkdir -p /tmp/swgraph-test
          docker run --rm \
            -v ${{ github.workspace }}/examples:/input:ro \
            -v /tmp/swgraph-test:/output \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph render /input/graphviz_minimal.gv /input/plantuml_sequence.puml /input/d2_architecture.d2 /input/mermaid_flowchart.mmd
          echo "=== Rendered files ==="
          ls -la /tmp/swgraph-test/
          test -f /tmp/swgraph-test/graphviz_minimal.svg
          test -f /tmp/swgraph-test/plantuml_sequence.svg
          test -f /tmp/swgraph-test/d2_architecture.svg
          test -f /tmp/swgraph-test/mermaid_flowchart.svg

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'

      - name: Build and push container image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

      - name: Verify published image pulls cleanly
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            swgraph version
