  - id: CVE-2025-68121
    statement: "Go crypto/tls certificate validation. d2 does not make outbound TLS connections during rendering."
    expired_at: "2026-09-06T00:00:00Z"

  - id: CVE-2026-25679
    statement: "Go net/url incorrect IPv6 parsing. d2 does not process untrusted URLs."
    expired_at: "2026-09-06T00:00:00Z"

  - id: CVE-2026-32280
    statement: "Go crypto/x509 DoS in certificate chain building. d2 does not validate external certificates."
